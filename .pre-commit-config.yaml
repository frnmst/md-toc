# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 'v4.6.0'
  hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-added-large-files
    - id: destroyed-symlinks
    - id: detect-private-key
    - id: check-ast
    - id: check-case-conflict
    - id: debug-statements
    - id: forbid-submodules
    - id: check-symlinks
    - id: check-shebang-scripts-are-executable
    - id: check-case-conflict
    - id: check-added-large-files
      args: ['--maxkb=4096']
    - id: destroyed-symlinks
    - id: double-quote-string-fixer
    - id: mixed-line-ending
      args: ['--fix=lf']

- repo: https://codeberg.org/fsfe/reuse-tool
  rev: 'v6.2.0'
  hooks:
    - id: reuse
      name: License compliance
      entry: reuse annotate
      args:
        - --license
        - GPL-3.0-or-later
        - --copyright
        - "Franco Masotti (See /README.md)"
        - --year
        - "2017-2026"
        - --skip-unrecognized
      pass_filenames: true
      exclude: |
        (?x)(
          ^docs/assets/|
          ^assets/|
          ^asciinema/|
          ^\.project.mk|
          ^\.github/FUNDING.yml|
          ^packages/|
          ^pyproject\.toml|
          ^safe_install\.sh|
          .*\.lock
        )

- repo: https://github.com/asottile/pyupgrade
  rev: 'v3.15.0'
  hooks:
    - id: pyupgrade

# YAPF and flake8 need to remain pinned.
- repo: https://github.com/google/yapf
  rev: 'v0.43.0' # frozen: 'v0.43.0'
  hooks:
    - id: yapf
      additional_dependencies: ['toml']

- repo: https://github.com/pycqa/flake8
  rev: '6.0.0' # frozen: 6.0.0
  hooks:
    - id: flake8
      exclude: ^\.scripts/
      additional_dependencies: ['flake8-docstrings']

- repo: https://github.com/PyCQA/bandit
  rev: '1.9.4'
  hooks:
    - id: bandit
      args: ['-c', 'pyproject.toml', '--level', 'LOW']
      additional_dependencies: ['bandit[toml]']

- repo: https://github.com/pycqa/isort
  rev: '9.0.0a3'
  hooks:
    - id: isort

- repo: https://github.com/frnmst/md-toc
  rev: '9.0.0'
  hooks:
    - id: md-toc
      args: ['-p', 'cmark', '-l6']

- repo: local
  hooks:
    - id: unit-tests
      name: unit tests
      language: system
      entry: make test
      verbose: true
      always_run: true
      pass_filenames: false
    - id: build-docs
      name: build docs
      language: system
      entry: make doc
      verbose: true
      always_run: true
      pass_filenames: false

- repo: https://github.com/jorisroovers/gitlint
  rev: 'v0.19.1'
  hooks:
    - id: gitlint

- repo: https://github.com/ljnsn/cz-conventional-gitmoji
  rev: 'v0.7.0'
  hooks:
    - id: conventional-gitmoji
